<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simple Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---------- HTML structure ---------- -->
<main class="chat">

  <!-- Message header: avatar, name, last seen -->
  <header class="header">
    <div class="avatar big friend online" id="headerAvatar">S</div>
    <div class="who">
      <div class="name">Sumedha</div>
      <div class="status" id="status">Online</div>
    </div>
  </header>

  <!-- Chat box: message page -->
  <section class="messages" id="messages" aria-live="polite">
    <div class="day">Today</div>
  </section>

  <!-- Chat box: message bottom -->
  <form class="bottom" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Type a message…" aria-label="Type a message" maxlength="500">
    <button id="send" type="submit" disabled>Send</button>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
